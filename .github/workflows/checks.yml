name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rules-and-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the verified Rust version
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.98.1 fmt --all --check
      - name: Test mission and file validation
        run: cargo +1.98.1 test --workspace --locked
      - name: Lint original crates
        run: cargo +1.98.1 clippy --workspace --all-targets --locked -- -D warnings

  gta-source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned source-test dependencies
        run: python -m pip install --only-binary=:all: -r gta/requirements-test.lock
      - name: Configure original GTA logic
        run: cmake -S gta -B build/gta-native -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(command -v python)"
      - name: Build and check source scenarios
        run: cmake --build build/gta-native && ctest --test-dir build/gta-native --output-on-failure
